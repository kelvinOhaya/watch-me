<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Me</title>
  </head>
  <body>
    <!-- index.html (insert before <div id="root">) -->
    <style>
      /* immediate black background and centered spinner */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 200ms ease;
      }
      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* spinner hidden by default, shown with .show-spinner */
      #initial-loader .spinner {
        opacity: 0;
        transition: opacity 200ms ease;
      }
      #initial-loader.show-spinner .spinner {
        opacity: 1;
      }
      /* simple spinner */
      .loader-dot {
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        margin: 6px;
        animation: blink 0.8s infinite ease-in-out;
      }
      .loader-dot:nth-child(2) {
        animation-delay: 0.12s;
      }
      .loader-dot:nth-child(3) {
        animation-delay: 0.24s;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }
    </style>

    <div id="initial-loader" aria-hidden="true">
      <div class="spinner" style="display: flex; align-items: center">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
